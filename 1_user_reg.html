<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC Travels - User Registration</title>
  <link rel="stylesheet" href="styles1.css">
</head>

<body>

  <header>
    <img src="images\logoabc.png" alt="ABC Travels Logo" width="40" height="40">
    <h1> Travels</h1>
  </header>

  <div class="container">
    <h2>
      <center>User Registration</center>
    </h2><BR><BR>
    <form id="registrationForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required><br><br>
      <label for="phoneNumber">Phone Number:</label>
      <input type="number" id="phoneNumber" required><br><br>
      <label for="email">Email:</label>
      <input type="text" id="email" required>
      <label for="password">Password:</label>
      <input type="password" id="password" required><br><br>
      <button type="button" onclick="register()">Register</button>
    </form>
  </div>

  <footer>
    <p>Contact us at: 7146XX | abctravelstrain@gmail.com | abctravels@gmail.com</p>
  </footer>

  <script>
    function register() {
      var name = document.getElementById('name').value;
      var phoneNumber = document.getElementById('phoneNumber').value;
      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;

      // Form validation
      if (name.trim() === '') {
        alert('Please enter your name.');
        return;
      }

      if (phoneNumber.trim() === '') {
        alert('Please enter your phone number.');
        return;
      } else if (phoneNumber.length > 10 || phoneNumber.length < 10) {
        alert('Please enter valid phone number.');
        return;
      }

      if (email.trim() === '') {
        alert('Please enter your email.');
        return;
      } else if (!/\S+@\S+\.\S+/.test(email.trim())) {
        alert('Please enter a valid email address.');
        return;
      }

      if (password.trim() === '') {
        alert('Please enter your password.');
        return;
      } else if (password.trim().length < 8) {
        alert('Password must be at least 8 characters long.');
        return;
      }

      // Encode name for URL
      var encodedName = encodeURIComponent(name);

      // Redirect to travel details page with name as query parameter
      window.location.href = "2_travel_details.html?name=" + encodedName;

    }
  </script>

</body>

</html>
